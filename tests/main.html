<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Main.elm</title>
    <style>
        .box {
          border: 2px solid;
          height: 100px;
          width: 100px;
          margin-top: 20px;
        }
        
        #red {
          background: red;
        }
        #green {
          background: green;
        }
    </style>
</head>
<body><!--comment-->
    <script src="build/main.js" id="node"></script>
    <script>
customElements.define(
    'my-iframe',
    class extends HTMLElement {
        iframe = document.createElement('iframe');

        connectedCallback() {
            // It's important to set `sandbox` on iframes for security.
            // https://developer.mozilla.org/en-US/docs/Web/HTML/Reference/Elements/iframe#sandbox
            this.iframe.sandbox = '';
            this.appendChild(this.iframe);
        }

        // Note: You can't call the attribute `srcdoc` even on the custom element.
        // For simplicity, Elm forbids that name regardless of element.
        // Simply choose another name.
        static observedAttributes = ['html'];
        
        attributeChangedCallback(name, _oldValue, newValue) {
            switch (name) {
                case 'html':
                    if (newValue === null) {
                        this.iframe.removeAttribute('srcdoc');
                    } else {
                        this.iframe.setAttribute('srcdoc', newValue);
                    }
                    break;
            }
        }
    }
);

window.customElements.define("elm-portal", class extends HTMLElement {
  // Base custom element stuff
  constructor() {
    super();
    this._targetNode = document.createElement('div');
  }

  connectedCallback() {
    document.querySelector(this.getAttribute("data-target-selector")).appendChild(this._targetNode);
  }
  
  disconnectedCallback() {
    document.querySelector(this.getAttribute("data-target-selector")).removeChild(this._targetNode);
  }

  // Re-implementations of HTMLElement functions
  get childNodes() {
    return this._targetNode.childNodes;
  }

//   get firstChild() {
//     return this._targetNode.firstChild;
//   }
    
//   get previousSibling() {
//     return this._targetNode.previousSibling;
//   }

//   get nextSibling() {
//     return this._targetNode.nextSibling;
//   }

  replaceData(...args) {
    return this._targetNode.replaceData(...args);
  }

  removeChild(...args) {
    return this._targetNode.removeChild(...args);
  }

  insertBefore(...args) {
    return this._targetNode.insertBefore(...args);
  }

  moveBefore(...args) {
    return this._targetNode.moveBefore(...args);
  }

  appendChild(...args) {
    // To cooperate with the Elm runtime
    requestAnimationFrame(() => {
      return this._targetNode.appendChild(...args);
    });
  }
});

        document.addEventListener("DOMContentLoaded", () => {
            const portal = document.createElement("div");
            portal.id = "portal";
            document.documentElement.append(portal);
            for (const key in Elm) {
                window.app = Elm[key].init({ node });
                break;
            }
            window.addEventListener("keydown", (event) => {
              if (event.ctrlKey && event.key === "r") {
                console.log("Hot reload!");
                var script = document.createElement("script");
                script.src = "build/hot.js?v=" + Date.now();
                document.head.append(script);
              }
            }, true);
        });
    </script>
</body>
</html>
