<!DOCTYPE html>
<html lang="en" style="font-family: monospace;">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>init animation</title>
</head>
<body>
    <script>
        {
            let queue = {};
            let pending = false;
            let uid = 0;

            window.cancelAnimationFrame = function (id)
            {
                delete queue[id];
            }

            window.requestAnimationFrame = function (callback)
            {
                let id = uid;
                uid++;
                queue[id] = callback;
                if (!pending)
                {
                    pending = true;
                    setTimeout(function () {
                        pending = false;
                        let maxId = uid;
                        for (let id2 in queue)
                        {
                            if (id2 >= maxId)
                            {
                                break;
                            }
                            let callback = queue[id2];
                            delete queue[id2];
                            callback();
                        }
                    }, 1000 - Date.now() % 1000);
                }
                return id;
            }
        }
    </script>
    <script src="build/animation_init.js" id="node"></script>
    <div id="show"></div>
    <script>
        for (const key in Elm) {
            const app = Elm[key].init({ node });
            app.ports.show.subscribe(n => {
                show.textContent = `port: ${n}`;
            });
            break;
        }
    </script>
</body>
</html>
