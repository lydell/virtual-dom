<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Worker</title>
</head>
<body>
    <script src="./build/main.js"></script>
    <script id="node">
        const app = Elm.Worker.init({
            node
        });

        console.log(app);
        app.ports.incoming.send(5);
        app.ports.outgoing.subscribe((v) => {
            console.log("outgoing", v);
        });
    </script>
</body>
</html>
